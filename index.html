<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Graph Matrix Input</title>

    <link rel = "stylesheet" href = "style.css">
    <script src="script.js"></script>
    <script src="branch_and_bound.js"></script>
    <script src="dp.js"></script>

</head>

<body>
    <div class="container">
        <h1>Graph Adjacency Matrix</h1>

        <label for="n"><b>Enter number of vertices (n):</b></label>
        
        <br>
        
        <input type="number" id="n" min="1" max="30" placeholder="Enter n">
        
        <button onclick="createMatrix()">Create Matrix</button>

        <div id="matrixInputs"></div>

        <button id="submitBtn" onclick="displayMatrix()" style="display:none">
            Submit Matrix
        </button>

        <p id="error"></p>

        <div id="result"></div>
    </div>

    <button id="bab" hidden> Branch And Bound </button>
    <button id="dp" hidden> Dynamic Programming </button>
</body>
</html>
