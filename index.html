
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Matrix Input</title>

    <link rel = "stylesheet" href = "style.css">

</head>

<body>
    <div class="container">
        <h1>Graph Adjacency Matrix</h1>

        <label for="n"><b>Enter number of vertices (n):</b></label>
        <br>
        <input type="number" id="n" min="1" max="30"
               placeholder="Enter n">
        <button onclick="createMatrix()">Create Matrix</button>

        <div id="matrixInputs"></div>

        <button id="submitBtn" onclick="displayMatrix()"
                style="display:none">
            Submit Matrix
        </button>

        <p id="error"></p>

        <div id="result"></div>
    </div>

    <script>
        function createMatrix() {
            const n = Number(document.getElementById("n").value);
            const matrixInputs = document.getElementById("matrixInputs");
            const result = document.getElementById("result");
            const error = document.getElementById("error");
            const submitBtn = document.getElementById("submitBtn");

            matrixInputs.innerHTML = "";
            result.innerHTML = "";
            error.textContent = "";
            submitBtn.style.display = "none";

            if (!Number.isInteger(n) || n < 1 || n > 30) {
                error.textContent =
                    "Enter an integer between 1 and 30.";
                return;
            }

            for (let i = 0; i < n; i++) {
                const row = document.createElement("div");
                row.className = "matrix-row";

                for (let j = 0; j < n; j++) {
                    const input = document.createElement("input");
                    input.type = "number";
                    input.step = "any";
                    input.id = `cell-${i}-${j}`;
                    input.placeholder = `${i + 1},${j + 1}`;
                    input.setAttribute(
                        "aria-label",
                        `Row ${i + 1}, column ${j + 1}`
                    );
                    row.appendChild(input);
                }

                matrixInputs.appendChild(row);
            }

            submitBtn.style.display = "inline-block";
        }

        function displayMatrix() {
            const n = Number(document.getElementById("n").value);
            const result = document.getElementById("result");
            const error = document.getElementById("error");

            error.textContent = "";
            result.innerHTML = "";

            const matrix = [];

            for (let i = 0; i < n; i++) {
                const row = [];

                for (let j = 0; j < n; j++) {
                    const input =
                        document.getElementById(`cell-${i}-${j}`);
                    const value = input.value.trim();

                    if (value === "" || !Number.isFinite(Number(value))) {
                        error.textContent =
                            `Enter a valid number at row ${i + 1}, column ${j + 1}.`;
                        input.focus();
                        return;
                    }

                    row.push(Number(value));
                }

                matrix.push(row);
            }

            const table = document.createElement("table");
            const header = table.createTHead().insertRow();
            header.insertCell().textContent = "Vertex";

            for (let j = 0; j < n; j++) {
                const th = document.createElement("th");
                th.textContent = `V${j + 1}`;
                header.appendChild(th);
            }

            const tbody = table.createTBody();

            for (let i = 0; i < n; i++) {
                const tr = tbody.insertRow();
                tr.insertCell().textContent = `V${i + 1}`;

                for (let j = 0; j < n; j++) {
                    tr.insertCell().textContent = matrix[i][j];
                }
            }

            result.appendChild(table);

            const heading = document.createElement("h3");
            heading.textContent = "Adjacency Matrix";
            result.prepend(heading);
        }
    </script>
</body>
</html>
