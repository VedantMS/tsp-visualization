
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Matrix Input</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0001;
        }

        input, button {
            padding: 10px;
            margin: 6px 0;
            font-size: 16px;
        }

        input[type="number"] {
            width: 100px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        #matrixInputs {
            display: grid;
            gap: 8px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .matrix-row {
            display: flex;
            gap: 8px;
        }

        .matrix-row input {
            width: 55px;
            min-width: 40px;
            text-align: center;
            box-sizing: border-box;
        }

        table {
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 12px 18px;
            text-align: center;
        }

        th {
            background: #dbeafe;
        }

        #error {
            color: #dc2626;
        }

        #result {
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Graph Adjacency Matrix</h1>

        <label for="n"><b>Enter number of vertices (n):</b></label>
        <br>
        <input type="number" id="n" min="1" max="30"
               placeholder="Enter n">
        <button onclick="createMatrix()">Create Matrix</button>

        <div id="matrixInputs"></div>

        <button id="submitBtn" onclick="displayMatrix()"
                style="display:none">
            Submit Matrix
        </button>

        <p id="error"></p>

        <div id="result"></div>
    </div>

    <script>
        function createMatrix() {
            const n = Number(document.getElementById("n").value);
            const matrixInputs = document.getElementById("matrixInputs");
            const result = document.getElementById("result");
            const error = document.getElementById("error");
            const submitBtn = document.getElementById("submitBtn");

            matrixInputs.innerHTML = "";
            result.innerHTML = "";
            error.textContent = "";
            submitBtn.style.display = "none";

            if (!Number.isInteger(n) || n < 1 || n > 30) {
                error.textContent =
                    "Enter an integer between 1 and 30.";
                return;
            }

            for (let i = 0; i < n; i++) {
                const row = document.createElement("div");
                row.className = "matrix-row";

                for (let j = 0; j < n; j++) {
                    const input = document.createElement("input");
                    input.type = "number";
                    input.step = "any";
                    input.id = `cell-${i}-${j}`;
                    input.placeholder = `${i + 1},${j + 1}`;
                    input.setAttribute(
                        "aria-label",
                        `Row ${i + 1}, column ${j + 1}`
                    );
                    row.appendChild(input);
                }

                matrixInputs.appendChild(row);
            }

            submitBtn.style.display = "inline-block";
        }

        function displayMatrix() {
            const n = Number(document.getElementById("n").value);
            const result = document.getElementById("result");
            const error = document.getElementById("error");

            error.textContent = "";
            result.innerHTML = "";

            const matrix = [];

            for (let i = 0; i < n; i++) {
                const row = [];

                for (let j = 0; j < n; j++) {
                    const input =
                        document.getElementById(`cell-${i}-${j}`);
                    const value = input.value.trim();

                    if (value === "" || !Number.isFinite(Number(value))) {
                        error.textContent =
                            `Enter a valid number at row ${i + 1}, column ${j + 1}.`;
                        input.focus();
                        return;
                    }

                    row.push(Number(value));
                }

                matrix.push(row);
            }

            const table = document.createElement("table");
            const header = table.createTHead().insertRow();
            header.insertCell().textContent = "Vertex";

            for (let j = 0; j < n; j++) {
                const th = document.createElement("th");
                th.textContent = `V${j + 1}`;
                header.appendChild(th);
            }

            const tbody = table.createTBody();

            for (let i = 0; i < n; i++) {
                const tr = tbody.insertRow();
                tr.insertCell().textContent = `V${i + 1}`;

                for (let j = 0; j < n; j++) {
                    tr.insertCell().textContent = matrix[i][j];
                }
            }

            result.appendChild(table);

            const heading = document.createElement("h3");
            heading.textContent = "Adjacency Matrix";
            result.prepend(heading);
        }
    </script>
</body>
</html>
